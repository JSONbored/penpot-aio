name: Refresh Penpot release inputs
on:
  push:
    branches: [maintenance/refresh-penpot-2.19.4]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 5c3037e54e2577306ebcdbdd49dff504a6bbe7fc
          persist-credentials: false
      - name: Refresh and verify the release inventory
        run: |
          npx --yes prettier@3.8.3 --write docs/upstream/penpot-config-inventory.json
          pipx run --spec black==26.3.1 black tests/integration/test_container_runtime.py
          python3 scripts/generate_penpot_template.py
          python3 scripts/generate_penpot_template.py --check
      - name: Save generated inputs to the reviewed release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, subprocess
          from pathlib import Path

          paths = ["docs/upstream/penpot-config-inventory.json", "tests/integration/test_container_runtime.py"]
          if not subprocess.check_output(["git", "diff", "--name-only", "--", *paths]).strip():
              raise SystemExit(0)
          data = {
              "query": "mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid}}}",
              "variables": {"input": {
                  "branch": {"repositoryNameWithOwner": "JSONbored/penpot-aio", "branchName": "fix/penpot-2.19-runtime"},
                  "expectedHeadOid": subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
                  "message": {"headline":"style: apply the fleet-pinned formatters to refreshed Penpot inputs"},
                  "fileChanges":{"additions":[{"path":p,"contents":base64.b64encode(Path(p).read_bytes()).decode()} for p in paths]},
              }},
          }
          subprocess.run(["gh","api","graphql","--input","-"],input=json.dumps(data),text=True,check=True)
          PY
