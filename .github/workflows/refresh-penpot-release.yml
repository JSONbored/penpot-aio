name: Inspect Penpot build
on:
  push:
    branches: [maintenance/refresh-penpot-2.19.4]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/penpot-2.19-runtime
          persist-credentials: false
      - run: docker build --progress=plain -t penpot-aio:pytest .
